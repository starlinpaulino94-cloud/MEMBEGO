# Secret scanning (auditoría del 2026-10-07, hallazgo C1 y M19).
#
# Durante semanas dos scripts llevaron escritas las claves `anon` y `service_role` de un
# proyecto de Supabase y la contraseña de su base de datos, y ningún control del CI lo vio.
# Este trabajo revisa con gitleaks los commits NUEVOS de cada push a main y de cada PR (no
# todo el historial: lo que ya estaba escrito hay que ROTARLO, y un escaneo completo fallaría
# siempre hasta entonces). La red barata que corre dentro de `npm test` es
# `tests/sin-credenciales.test.ts`.
#
# Debe marcarse como REQUIRED CHECK en la protección de la rama por defecto (ver docs/DEVOPS.md).
name: Secretos

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: secretos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secretos:
    name: Secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # El escaneo mira el rango de commits del push o del PR: necesita su historia.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Genera los recibos de los pagos con tarjeta (CardNET) anteriores al 16-10-2026.
#
# Hasta ese día un cobro aprobado activaba la membresía o la compra sin dejar la
# venta oficial, así que el negocio no tenía qué imprimir y el cliente tampoco.
# Desde entonces cada cobro nuevo deja su recibo solo; este flujo recupera los
# anteriores, con la FECHA y la autorización reales de cada cobro.
#
# Se lanza a mano: Actions → «Recibos de pagos con tarjeta anteriores» → Run
# workflow. Por defecto es SIMULACIÓN (no escribe nada): el resumen del job
# lista qué se crearía y qué se omite (cobrado sin entregar = conciliar). Para
# crearlos, volver a lanzarlo con «aplicar» marcado. Es idempotente: un pago
# que ya tiene recibo no se toca, así que repetirlo no duplica nada.
#
# Usa el mismo secreto que el despliegue de migraciones
# (`MIGRATIONS_DATABASE_URL`, la DIRECT_URL de Supabase) y el entorno `production`.
name: Recibos de pagos con tarjeta anteriores

on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: 'Crear los recibos (desmarcado = solo simulación, no escribe nada)'
        type: boolean
        default: false
      empresa:
        description: 'Solo esta empresa (id). Vacío = todas'
        type: string
        default: ''
      desde:
        description: 'Solo cobros desde esta fecha (AAAA-MM-DD). Vacío = todos'
        type: string
        default: ''

concurrency:
  group: recibos-tarjetas-anteriores
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recibos:
    name: ${{ inputs.aplicar && 'Crear recibos' || 'Simulación (no escribe)' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Recibos
        env:
          DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
          APLICAR: ${{ inputs.aplicar && '--aplicar' || '' }}
          EMPRESA: ${{ inputs.empresa }}
          DESDE: ${{ inputs.desde }}
        run: |
          ARGS=()
          [ -n "$APLICAR" ] && ARGS+=("$APLICAR")
          [ -n "$EMPRESA" ] && ARGS+=("--empresa=$EMPRESA")
          [ -n "$DESDE" ] && ARGS+=("--desde=$DESDE")
          # La salida va a un archivo para conservar el código de salida del script (encadenar la salida a otro comando lo perdería).
          set +e
          npx tsx scripts/recibos-tarjetas-anteriores.ts "${ARGS[@]}" > salida.txt 2>&1
          CODIGO=$?
          { echo '```'; cat salida.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat salida.txt
          exit $CODIGO
